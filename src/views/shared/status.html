<!doctype html>
<html lang="vi">
<head>{% include "shared/navigation-head.html" %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mạch Đồng</title>
  <link rel="icon" href="{{ url_for('static', filename='assets/co-ma/avatar-co-ma.webp', v=asset_v) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='shell.css', v=asset_v) }}">
</head>
<body class="app-workspace">
{% include "shared/header.html" %}
{% include "shared/sidebar.html" %}
<main id="main-content" tabindex="-1" class="app-content app-status">
  <section class="app-status-card app-glass" aria-labelledby="status-title">
    <h1 id="status-title" class="app-page-title">{{ self.title() }}</h1>
    <p>{% block description %}{% endblock %}</p>
    <div class="app-status-actions">
      <a href="/simulation" class="app-control">Mở mô phỏng</a>
      <a href="/community" class="app-control">Mở kho CSV</a>
    </div>
  </section>
</main>
</body>
</html>
