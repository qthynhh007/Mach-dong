{% macro co_ma(label="") -%}
<span class="co-ma-sprite"
      {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}></span>
{%- endmacro %}

{% macro co_ma_wave(size) -%}
<span class="co-ma-wave-avatar" aria-hidden="true">
  <img src="{{ url_for('static', filename='assets/co-ma/wave.png') }}"
       width="{{ size }}" height="{{ size }}" alt="" decoding="async">
</span>
{%- endmacro %}
