<svg id="field-scene" class="sim-scene" viewBox="0 0 1000 560" role="img"
     aria-labelledby="field-title field-description">
  <title id="field-title">Cánh đồng lúa nhìn xéo từ trên xuống</title>
  <desc id="field-description">Thửa ruộng ở giữa có các hàng lúa, bờ đất và mặt nước. Màu tán lúa và hiệu ứng nước minh họa kịch bản.</desc>
  <defs>
    <linearGradient id="field-sky" x2="0" y2="1">
      <stop stop-color="#9bc9ca"/><stop offset="1" stop-color="#f5e9b7"/>
    </linearGradient>
    <linearGradient id="field-ground" x2=".68" y2="1">
      <stop stop-color="#c6d68a"/><stop offset=".55" stop-color="#91ad58"/><stop offset="1" stop-color="#506c3d"/>
    </linearGradient>
    <linearGradient id="field-canal" x2="0" y2="1">
      <stop stop-color="#396e6b"/><stop offset="1" stop-color="#9dceae"/>
    </linearGradient>
    <linearGradient id="field-base" x2=".3" y2="1">
      <stop stop-color="#638b6a"/><stop offset=".45" stop-color="#557c63"/><stop offset="1" stop-color="#3b6155"/>
    </linearGradient>
    <linearGradient id="field-flood" x2=".2" y2="1">
      <stop stop-color="#afd8c5"/><stop offset="1" stop-color="#479a9c"/>
    </linearGradient>
    <radialGradient id="field-salt" cx=".76" cy=".52" r=".62">
      <stop stop-color="#d8a75f"/><stop offset="1" stop-color="#a27c52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="field-sun" cx=".13" cy=".1" r=".75">
      <stop stop-color="#fff1c8"/><stop offset="1" stop-color="#ffeab6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="field-far-rows" width="14" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0 2h14m-14 3h14" stroke="#386840" stroke-width=".8" opacity=".42"/>
      <path d="M0 3.5h14" stroke="#d4e78a" stroke-width=".7" opacity=".6"/>
    </pattern>
    <pattern id="field-furrows" width="38" height="34" patternUnits="userSpaceOnUse">
      <path d="m7 0 4 19-4 15m4-15 18-4 9 6m-9-6-4-15" fill="none" stroke="#57422f" opacity=".6"/>
      <path d="M2 31h6m17-8 9-2" stroke="#d6b88d" opacity=".55"/>
    </pattern>
    <pattern id="field-water-marks" width="92" height="37" patternUnits="userSpaceOnUse">
      <path d="M2 11h28m22 17h31m-53 6h17" fill="none" stroke="#d7f2d6" stroke-width=".9" opacity=".32"/>
    </pattern>
    <polygon id="field-parcel" points="360,198 650,146 973,438 125,533"/>
    <polygon id="field-neighbor-east" points="669,129 940,114 1290,317 1000,343"/>
    <polygon id="field-neighbor-west" points="-12,243 344,186 116,531 -215,588"/>
    <clipPath id="field-clip"><use href="#field-parcel"/></clipPath>
    <symbol id="field-palm" viewBox="0 0 44 49">
      <path d="M20 46q4-15 3-29" fill="none" stroke="#6e684c" stroke-width="2.5"/>
      <path d="M23 17Q15 5 4 13m19 4Q27 2 38 6M23 17Q11 13 3 24m20-7q13-5 20 4m-20-4q-6 2-7 13m7-13q9 3 12 12" fill="none" stroke="#416b50" stroke-linecap="round" stroke-width="3.4"/>
    </symbol>
  </defs>

  <rect width="1000" height="190" fill="url(#field-sky)"/>
  <path d="M0 81Q145 56 284 78T558 73T836 59T1000 72V181H0Z" fill="#89a481"/>
  <path d="M0 92Q132 71 280 91T545 91T801 79T1000 89V181H0Z" fill="#577e66"/>

  <path d="M0 117C201 126 344 111 508 100S846 77 1000 88L1000 106C802 94 698 116 514 122S197 160 0 144Z" fill="url(#field-canal)"/>

  <use href="#field-neighbor-east" fill="url(#field-far-rows)" opacity=".35"/>
  <use href="#field-neighbor-west" fill="#91ad61"/>
  <use href="#field-neighbor-west" fill="url(#field-far-rows)" opacity=".28"/>
  <path d="M0 242 344 186 116 531 0 550M663 139l310 311 27-3" fill="none" stroke="#d3c794" stroke-width="6" stroke-linejoin="round"/>
  <path d="M0 456 187 419M0 391 237 341M0 324l281-55M0 274l324-62m464 12 212-23m-153 80 153-17m-90 80 90-10" stroke="#638548" stroke-width="2" opacity=".76"/>

  <path id="field-neighbor-crops-west" fill="none" stroke="#4e7e49" stroke-width="1.4" opacity=".82"/>
  <g opacity=".9">
    <use href="#field-palm" x="6" y="66" width="49" height="53"/>
    <use href="#field-palm" x="55" y="76" width="41" height="46"/>
    <use href="#field-palm" x="325" y="63" width="39" height="43"/>
    <use href="#field-palm" x="490" y="49" width="52" height="57"/>
    <use href="#field-palm" x="758" y="48" width="50" height="55"/>
    <use href="#field-palm" x="812" y="52" width="38" height="42"/>
    <use href="#field-palm" x="943" y="42" width="60" height="64"/>
  </g>
  <path d="M100 541 350 193 653 138 986 440 981 465 126 557Z" fill="#596444" opacity=".45"/>
  <use href="#field-parcel" fill="url(#field-base)" stroke="#a79c67" stroke-width="15" stroke-linejoin="round"/>
  <use href="#field-parcel" fill="none" stroke="#d4c996" stroke-width="7" stroke-linejoin="round"/>
  <g clip-path="url(#field-clip)">
    <g class="sim-field-dry">
      <use href="#field-parcel" fill="#a1825f"/>
      <use href="#field-parcel" fill="url(#field-furrows)"/>
    </g>
    <g class="sim-field-water">
      <use href="#field-parcel" fill="url(#field-flood)"/>
      <use href="#field-parcel" fill="url(#field-water-marks)"/>
      <path id="field-ripples" class="sim-field-ripples" fill="none" stroke="#cfefe1" stroke-width="1.35" stroke-linecap="round"/>
    </g>
    <use href="#field-parcel" class="sim-field-salt" fill="url(#field-salt)"/>
    <path id="field-rows" fill="none" stroke="#a1c58a" stroke-width="1.1" opacity=".52"/>
    <path id="field-shadows" fill="none" stroke="#142e23" stroke-width="2.1" opacity=".32"/>
    <path id="field-leaves" class="sim-field-leaves" stroke-width=".45" stroke-linejoin="round"/>
    <path id="field-tips" class="sim-field-tips" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path id="field-burn" class="sim-field-burn" fill="none" stroke-linecap="round"/>
    <path id="field-grain" class="sim-field-grain" fill="none" stroke-linecap="round" stroke-width="1.6"/>
    <use href="#field-parcel" class="sim-field-submergence" fill="url(#field-flood)"/>
  </g>
  <rect class="sim-field-light" width="1000" height="560" fill="url(#field-sun)"/>
  <path d="M126 540q414-62 844-94" fill="none" stroke="#eee2aa" stroke-width="1.4" opacity=".7"/>
</svg>
